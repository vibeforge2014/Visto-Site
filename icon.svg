<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0A4356"/>
      <stop offset=".6" stop-color="#04293B"/>
      <stop offset="1" stop-color="#020F1A"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FF8E5"/>
      <stop offset=".5" stop-color="#2BD4D4"/>
      <stop offset="1" stop-color="#058F98"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66C9FB"/>
      <stop offset=".5" stop-color="#1CA3EF"/>
      <stop offset="1" stop-color="#0A6CC3"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#CFF6FF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- soft color bloom behind both glass screens -->
  <g filter="url(#glow)" opacity=".5">
    <rect x="17" y="28" width="72" height="51" rx="13" fill="#2BD4D4"/>
    <rect x="40" y="49" width="72" height="51" rx="13" fill="#1CA3EF"/>
  </g>
  <!-- back glass screen (teal), upper left -->
  <rect x="17" y="28" width="72" height="51" rx="13" fill="url(#teal)"/>
  <rect x="17.75" y="28.75" width="70.5" height="49.5" rx="12.25" fill="none" stroke="#EAFFFC" stroke-opacity=".45" stroke-width="1.5"/>
  <!-- front glass screen (blue), translucent over the teal, glowing rim -->
  <rect x="40" y="49" width="72" height="51" rx="13" fill="url(#blue)" fill-opacity=".9"/>
  <rect x="41.5" y="50.5" width="69" height="48" rx="11.5" fill="none" stroke="url(#seam)" stroke-width="3"/>
</svg>
